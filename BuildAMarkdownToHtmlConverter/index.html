<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Markdown to HTML Converter</title>

  <meta name="author" content="Agnese Salutari">
  <meta name="description" content="An Example of Markdown To HTML Converter App by Agnese Salutari">

  <link rel="stylesheet" href="styles.css">
</head>

<body>
  <h1>Markdown to HTML Converter</h1>
  <div id="container">
    <section class="converter-panel">
      <h2 id="input-heading">Markdown Input:</h2>
      <textarea id="markdown-input" aria-labelledby="input-heading" placeholder="Enter your markdown here..."></textarea>
    </section>
    <section class="converter-panel">
      <h2 id="html-output-heading">Raw HTML Output:</h2>
      <div id="html-output"></div>
    </section>
    <section class="converter-panel">
      <h2 id="preview-heading">HTML Preview:</h2>
      <div id="preview"></div>
    </section>
  </div>

  <script src="script.js"></script>
</body>

</html>
